name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (Riverpod / Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare iOS build settings
        run: flutter build ios --config-only --release --no-codesign

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into .ipa
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r spine_clinic_app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spine-clinic-ios-ipa
          path: spine_clinic_app.ipa
          retention-days: 7
