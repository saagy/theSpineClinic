name: Build iOS & Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$URL" ]; then URL="https://ujketpugttdqpcixrnga.supabase.co"; fi
          if [ -z "$KEY" ]; then KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqa2V0cHVndHRkcXBjaXhybmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDczOTAsImV4cCI6MjA5NjA4MzM5MH0.TOUZwiAX6-GMygzXPriHKtYjd-FKGg0zOl8maI5cDa0"; fi
          echo "SUPABASE_URL=$URL" > .env
          echo "SUPABASE_ANON_KEY=$KEY" >> .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (Riverpod / Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare iOS build settings
        run: flutter build ios --config-only --release --no-codesign

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into .ipa
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r spine_clinic_app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spine-clinic-ios-ipa
          path: spine_clinic_app.ipa
          retention-days: 7

  deploy-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (Riverpod / Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Flutter Web (Release)
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$URL" ]; then URL="https://ujketpugttdqpcixrnga.supabase.co"; fi
          if [ -z "$KEY" ]; then KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqa2V0cHVndHRkcXBjaXhybmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDczOTAsImV4cCI6MjA5NjA4MzM5MH0.TOUZwiAX6-GMygzXPriHKtYjd-FKGg0zOl8maI5cDa0"; fi
          flutter build web --release \
            --dart-define="SUPABASE_URL=$URL" \
            --dart-define="SUPABASE_ANON_KEY=$KEY"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPINE_CLINIC_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: spine-clinic-app
